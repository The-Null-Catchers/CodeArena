global:
  scrape_interval: 10s
scrape_configs:
  - job_name: api
    static_configs: [{ targets: ["api:4000"] }]
  - job_name: worker
    static_configs: [{ targets: ["worker:4100"] }]
  - job_name: scheduler
    static_configs: [{ targets: ["scheduler:4200"] }]
  - job_name: delivery-worker
    static_configs: [{ targets: ["delivery-worker:4300"] }]
