name: CodeArena CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.11.0 }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --dir packages/execution-sdk build
      - run: docker build -f infrastructure/docker/service.Dockerfile .
      - run: docker build -f infrastructure/docker/web.Dockerfile .
  execution-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.11.0 }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm runtimes:build
      - run: cp .env.example .env && docker compose up -d --build --wait postgres redis mailpit api scheduler worker web
      - run: pnpm test:security
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:integration && pnpm test:e2e
      - run: docker compose -f docker-compose.yml -f docker-compose.workers.yml up -d --build --wait worker worker-02
      - run: pnpm test:fleet
      - run: docker run -d --name codearena-redis-probe -p 127.0.0.1:6380:6379 redis:7.4-bookworm
      - run: pnpm test:redis
      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.workers.yml logs --no-color > compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-evidence
          path: |
            compose.log
            playwright-report/
            test-results/

  infrastructure-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t codearena-runtime-python:3.13 runtimes/python
      - run: cp .env.example .env && docker compose up -d --build --wait
      - run: |
          curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://localhost:8080/health/ready
          curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://localhost:9090/-/ready
          curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://localhost:3001/api/health
          docker compose exec -T api node -e "fetch('http://minio:9000/minio/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      - if: always()
        run: docker compose logs --no-color > infrastructure.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infrastructure-evidence
          path: infrastructure.log
